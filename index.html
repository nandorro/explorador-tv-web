<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorador TV Web</title>
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#121212;--pn:#1e1e1e;--fg:#eee;--mu:#90a4ae;--ac:#3d8bff;--ac2:#82b1ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--pn)}
button{background:#333;color:var(--fg);border:2px solid transparent;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button:focus,button:hover{outline:none;border-color:var(--ac2);background:#2a3a55}
#path{padding:6px 12px;color:var(--mu);background:#181818;word-break:break-all}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{padding:10px 14px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid #222}
#list li.sel{background:#3d8bff55;outline:2px solid var(--ac2);outline-offset:-2px}
#list li.mk .nm::before{content:"✔ ";color:#69f0ae}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sz{color:var(--mu)}
#msg{padding:6px 12px;color:var(--mu);background:var(--pn);min-height:30px}
#ov{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;z-index:5}
#ov.on{display:flex}
#ovh{display:flex;gap:6px;padding:8px;background:var(--pn);align-items:center}
#ovh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ovb{flex:1;display:flex;min-height:0}
#ovb>*{flex:1;width:100%;min-height:0;border:0;background:#000;color:var(--fg)}
#ovb img{object-fit:contain}
#ovb textarea{background:#1a1a1a;font:15px/1.4 Consolas,monospace;padding:10px;resize:none;white-space:pre}
#ovb pre{margin:0;padding:12px;overflow:auto;white-space:pre-wrap}
#ovb audio{align-self:center;height:60px}
#menu{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#menu.on{display:flex}
#mb{background:var(--pn);border-radius:10px;padding:14px;min-width:280px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
#mb h3{margin:0 0 6px}
#warn{padding:30px;max-width:640px;margin:auto;text-align:center;display:none}
</style>
</head>
<body>
<div id="warn"><h2>Este navegador no permite modificar carpetas</h2><p>Para editar usa Chrome o Edge. Aquí solo puedes abrir una carpeta en <b>solo lectura</b>.</p></div>
<div id="bar">
 <button onclick="openDir()">📂 Abrir carpeta</button>
 <button onclick="openFiles()">📄 Abrir archivos</button>
 <button onclick="up()">⬆ Subir</button>
 <button onclick="newMenu()">➕ Nuevo</button>
 <button onclick="compressMenu()">🗜 Comprimir</button>
 <button onclick="paste()">📋 Pegar</button>
 <button onclick="markAll()">☑ Marcar todo</button>
 <button onclick="sortNext()">↕ Ordenar</button>
 <button onclick="itemMenu()">⋯ Más</button>
</div>
<div id="path">Pulsa «Abrir carpeta» y concede permiso de lectura y escritura.</div>
<ul id="list"></ul>
<div id="msg"></div>
<div id="ov"><div id="ovh"><b id="ovt"></b><button id="ovs" onclick="saveText()" style="display:none">💾 Guardar</button><button onclick="closeOv()">✖ Cerrar</button></div><div id="ovb"></div></div>
<div id="menu"><div id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const EXT={img:'jpg jpeg png gif webp bmp svg avif',vid:'mp4 webm mkv mov m4v ogv avi',aud:'mp3 m4a aac flac wav ogg oga opus',txt:'txt md json xml html htm css js ts csv log ini cfg conf yml yaml java kt py sh bat c h cpp php sql srt properties gradle',arc:'zip jar'};
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const kind=n=>{const e=ext(n);for(const k in EXT)if(EXT[k].split(' ').includes(e))return k;return e=='pdf'?'pdf':''};
const ICON={dir:'📁',img:'🖼',vid:'🎬',aud:'🎵',txt:'📝',arc:'🗜',pdf:'📕','':'📄'};
const human=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
let stack=[],cur=null,items=[],sel=0,marked=new Set(),clip=null,sortMode=0,editing=null,blobUrl=null,mediaList=[];
const SORTS=['Nombre','Tamaño','Fecha'];
function say(t){$('msg').textContent=t}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ---- permisos y apertura de carpeta ---- */
let readOnly=false;
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('exptv',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
async function saveHandle(h){try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,'last')}catch{}}
async function lastHandle(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('h').objectStore('h').get('last');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch{return null}}
async function grant(h){
  const o={mode:'readwrite'};
  if(await h.queryPermission(o)==='granted')return true;
  return await h.requestPermission(o)==='granted';   // muestra el aviso del navegador
}
async function start(h){
  if(!await grant(h)){say('Permiso denegado: sin él no se puede leer ni modificar la carpeta. Pulsa «Abrir carpeta» y elige «Permitir».');return false}
  readOnly=false;cur=h;stack=[h];await saveHandle(h);await load();say('Permiso concedido. Carpeta abierta con lectura y escritura.');return true;
}
function openDir(){
  const o=[];
  if(window.showDirectoryPicker)o.push(['✅ Continuar: elegir carpeta y dar permiso',pickDir]);
  o.push(['👁 Solo lectura (sin permisos de escritura)',()=>$('rofolder').click()]);
  choose('El navegador te pedirá: 1) elegir la carpeta y 2) «Ver y editar archivos» → Permitir. No deja elegir carpetas del sistema ni la raíz de Descargas/Documentos: elige una subcarpeta.',o);
}
async function pickDir(){
  try{
    const h=await showDirectoryPicker({mode:'readwrite',id:'exptv'});
    await start(h);
  }catch(e){
    if(e.name=='AbortError')say('Cancelado.');
    else if(e.name=='SecurityError')say('El navegador no permite esa carpeta (carpeta del sistema o raíz de Descargas/Documentos). Elige una subcarpeta o usa «Solo lectura». '+e.message);
    else say('Error: '+e.name+' '+e.message);
  }
}
async function reopenLast(){
  const h=await lastHandle();if(!h){say('No hay carpeta anterior guardada');return}
  await start(h);
}
class MemDir{constructor(n){this.name=n;this.kind='directory';this.m=new Map()}
  async*entries(){for(const e of this.m)yield e}}
class MemFile{constructor(f){this.name=f.name;this.kind='file';this.f=f}async getFile(){return this.f}}
function fromInput(inp){
  const fs=[...inp.files];if(!fs.length){say('No se eligió nada');return}
  const root=new MemDir(fs[0].webkitRelativePath.split('/')[0]);
  for(const f of fs){const p=f.webkitRelativePath.split('/').slice(1);let d=root;
    p.slice(0,-1).forEach(s=>{if(!d.m.has(s))d.m.set(s,new MemDir(s));d=d.m.get(s)});d.m.set(f.name,new MemFile(f))}
  readOnly=true;cur=root;stack=[root];load();say('Carpeta abierta en SOLO LECTURA (este modo no pide permiso de escritura). Para editar usa Chrome/Edge de ordenador o Android.');inp.value='';
}
function blockRO(){if(readOnly){say('Modo solo lectura: abre la carpeta con permisos para modificar');return true}return false}
document.addEventListener('DOMContentLoaded',async()=>{
  const inp=document.createElement('input');inp.type='file';inp.id='rofolder';inp.webkitdirectory=true;inp.style.display='none';inp.onchange=()=>fromInput(inp);document.body.appendChild(inp);
  if(window.showDirectoryPicker&&await lastHandle()){const b=document.createElement('button');b.textContent='🔁 Reabrir última carpeta';b.onclick=reopenLast;$('bar').insertBefore(b,$('bar').children[1])}
});
async function openFiles(){
  try{
    const hs=await (window.showOpenFilePicker?showOpenFilePicker({multiple:true}):Promise.reject(new Error('no soportado')));
    for(const h of hs){const f=await h.getFile();await openEntry({name:h.name,kind:'file',handle:h,file:f,size:f.size,date:f.lastModified})}
  }catch(e){if(e.name!='AbortError')say('Error: '+e.message)}
}
async function load(){
  items=[];marked.clear();
  for await(const [name,h] of cur.entries()){
    let size=0,date=0;
    if(h.kind=='file'){try{const f=await h.getFile();size=f.size;date=f.lastModified}catch{}}
    items.push({name,kind:h.kind,handle:h,size,date});
  }
  sortItems();sel=0;render();
}
function sortItems(){
  items.sort((a,b)=>(b.kind=='directory')-(a.kind=='directory')||(sortMode==1?b.size-a.size:sortMode==2?b.date-a.date:a.name.localeCompare(b.name,'es',{numeric:true})));
}
function sortNext(){sortMode=(sortMode+1)%3;sortItems();render();say('Orden: '+SORTS[sortMode])}
function render(){
  $('path').textContent=stack.map(s=>s.name).join(' / ')+'  ('+items.length+' elementos)';
  const ul=$('list');ul.innerHTML='';
  items.forEach((it,i)=>{
    const li=document.createElement('li');
    li.className=(i==sel?'sel ':'')+(marked.has(it.name)?'mk':'');
    const k=it.kind=='directory'?'dir':kind(it.name);
    li.innerHTML='<span>'+ICON[k]+'</span><span class="nm"></span><span class="sz">'+(it.kind=='file'?human(it.size):'')+'</span>';
    li.querySelector('.nm').textContent=it.name;
    li.onclick=()=>{sel=i;render();openItem()};
    li.oncontextmenu=e=>{e.preventDefault();sel=i;render();itemMenu()};
    ul.appendChild(li);
  });
  const s=ul.querySelector('.sel');if(s)s.scrollIntoView({block:'nearest'});
}
async function up(){if(stack.length>1){stack.pop();cur=stack[stack.length-1];await load()}else say('Ya estás en la carpeta raíz elegida')}
async function openItem(){
  const it=items[sel];if(!it)return;
  if(it.kind=='directory'){cur=it.handle;stack.push(cur);await load();return}
  if(kind(it.name)=='arc'){choose('Comprimido: '+it.name,[['Extraer en carpeta "'+it.name.replace(/\.[^.]+$/,'')+'"',()=>extract(it,true)],['Extraer aquí',()=>extract(it,false)]]);return}
  it.file=await it.handle.getFile();await openEntry(it);
}
async function openEntry(it){
  const k=kind(it.name);
  if(k=='img'||k=='vid'||k=='aud'||k=='pdf'){
    mediaList=items.filter(x=>x.kind=='file'&&kind(x.name)==k);
    if(!mediaList.includes(it)){mediaList=[it]}
    showMedia(it,k);
  }else{
    if(it.file.size>8*1048576){say('Archivo demasiado grande para editar (máx. 8 MB)');return}
    showText(it);
  }
}
function overlay(title,node,save){
  closeBlob();$('ovt').textContent=title;$('ovs').style.display=save?'':'none';
  const b=$('ovb');b.innerHTML='';b.appendChild(node);$('ov').classList.add('on');
}
function closeBlob(){if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}}
function closeOv(){
  if(editing&&editing.dirty&&!confirm('Hay cambios sin guardar. ¿Cerrar igualmente?'))return;
  editing=null;$('ov').classList.remove('on');$('ovb').innerHTML='';closeBlob();
}
async function showMedia(it,k){
  const f=it.file||await it.handle.getFile();
  closeBlob();blobUrl=URL.createObjectURL(f);
  let n;
  if(k=='img'){n=new Image();n.src=blobUrl}
  else if(k=='vid'||k=='aud'){n=document.createElement(k=='vid'?'video':'audio');n.src=blobUrl;n.controls=true;n.autoplay=true;
    n.onended=()=>step(1);}
  else{n=document.createElement('iframe');n.src=blobUrl}
  const old=blobUrl;overlay(it.name+'  ('+(mediaList.indexOf(it)+1)+'/'+mediaList.length+')',n);blobUrl=old;
  ov.cur=it;ov.k=k;
  if(n.focus&&k!='pdf')n.tabIndex=0;
}
const ov={};
function step(d){const i=mediaList.indexOf(ov.cur)+d;if(i>=0&&i<mediaList.length)showMedia(mediaList[i],ov.k)}
async function showText(it){
  const t=document.createElement('textarea');t.value=await it.file.text();t.spellcheck=false;
  editing={it,dirty:false};t.oninput=()=>{editing.dirty=true;$('ovt').textContent='● '+it.name};
  overlay(it.name,t,true);t.focus();
}
async function saveText(){if(blockRO())return;
  if(!editing)return;
  try{const w=await editing.it.handle.createWritable();await w.write($('ovb').firstChild.value);await w.close();
    editing.dirty=false;$('ovt').textContent=editing.it.name;say('Guardado');}catch(e){say('No se pudo guardar: '+e.message)}
}
/* ---- menús ---- */
function choose(title,opts){
  const mb=$('mb');mb.innerHTML='<h3></h3>';mb.firstChild.textContent=title;
  opts.concat([['Cancelar',()=>{}]]).forEach(([t,fn])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{closeMenu();fn()};mb.appendChild(b)});
  $('menu').classList.add('on');mb.querySelector('button').focus();
}
function closeMenu(){$('menu').classList.remove('on');}
function targets(){return marked.size?items.filter(i=>marked.has(i.name)):(items[sel]?[items[sel]]:[])}
function markAll(){if(marked.size==items.length)marked.clear();else items.forEach(i=>marked.add(i.name));render()}
function newMenu(){choose('Nuevo',[['📝 Archivo de texto',()=>mk('file')],['📁 Carpeta',()=>mk('dir')]])}
async function mk(t){if(blockRO())return;
  const n=prompt(t=='file'?'Nombre del archivo':'Nombre de la carpeta',t=='file'?'nuevo.txt':'Nueva carpeta');if(!n)return;
  try{if(t=='file')await cur.getFileHandle(n,{create:true});else await cur.getDirectoryHandle(n,{create:true});await load()}catch(e){say('Error: '+e.message)}
}
function itemMenu(){
  const it=items[sel];if(!it)return;
  const o=[['✔ Marcar / desmarcar',()=>{marked.has(it.name)?marked.delete(it.name):marked.add(it.name);render()}],
   ['📋 Copiar',()=>{clip=targets();say(clip.length+' copiado(s)')}],
   ['✏ Renombrar',()=>rename(it)],['🗑 Eliminar',()=>del()],['ℹ Propiedades',()=>say(it.name+' · '+(it.kind=='file'?human(it.size)+' · ':'')+(it.date?new Date(it.date).toLocaleString():''))]];
  if(it.kind=='file'&&kind(it.name)!='arc')o.splice(1,0,['📝 Editar como texto',async()=>{it.file=await it.handle.getFile();showText(it)}]);
  if(it.kind=='file')o.push(['⬇ Descargar',async()=>{const f=await it.handle.getFile();const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=it.name;a.click()}]);
  choose(it.name,o);
}
async function copyEntry(src,dstDir,name){
  if(src.kind=='file'){const f=await src.handle.getFile();const h=await dstDir.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(f);await w.close()}
  else{const d=await dstDir.getDirectoryHandle(name,{create:true});for await(const [n,h] of src.handle.entries())await copyEntry({kind:h.kind,handle:h},d,n)}
}
async function uniqueName(dir,name){
  const has=async n=>{try{await dir.getFileHandle(n);return true}catch{}try{await dir.getDirectoryHandle(n);return true}catch{}return false};
  if(!await has(name))return name;
  const m=name.match(/^(.*?)(\.[^.]*)?$/);for(let i=1;;i++){const n=m[1]+' ('+i+')'+(m[2]||'');if(!await has(n))return n}
}
async function paste(){if(blockRO())return;
  if(!clip||!clip.length){say('Nada copiado');return}
  try{for(const s of clip)await copyEntry(s,cur,await uniqueName(cur,s.name));say('Pegado');await load()}catch(e){say('Error al pegar: '+e.message)}
}
async function rename(it){if(blockRO())return;
  const n=prompt('Nuevo nombre',it.name);if(!n||n==it.name)return;
  try{
    if(it.handle.move)await it.handle.move(n);
    else{await copyEntry(it,cur,n);await cur.removeEntry(it.name,{recursive:true})}
    await load();
  }catch(e){say('Error: '+e.message)}
}
async function del(){if(blockRO())return;
  const t=targets();if(!t.length||!confirm('¿Eliminar '+t.length+' elemento(s)? No se puede deshacer.'))return;
  try{for(const i of t)await cur.removeEntry(i.name,{recursive:true});say('Eliminado');await load()}catch(e){say('Error: '+e.message)}
}
/* ---- zip ---- */
function compressMenu(){
  const t=targets();if(!t.length){say('Marca o selecciona algo');return}
  choose('Comprimir '+t.length+' elemento(s)',[['ZIP (compatible con todo)',()=>compress(t)],['7z: no disponible en la versión web (usa la app Android)',()=>{}]]);
}
async function addToZip(z,it,path){
  if(it.kind=='file')z.file(path+it.name,await it.handle.getFile());
  else{const f=z.folder(path+it.name);for await(const [n,h] of it.handle.entries())await addToZip(z,{name:n,kind:h.kind,handle:h},path+it.name+'/')}
}
async function compress(t){if(blockRO())return;
  try{
    say('Comprimiendo...');const z=new JSZip();for(const i of t)await addToZip(z,i,'');
    const name=await uniqueName(cur,(t.length==1?t[0].name.replace(/\.[^.]+$/,''):'comprimido')+'.zip');
    const blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});
    const w=await(await cur.getFileHandle(name,{create:true})).createWritable();await w.write(blob);await w.close();
    say('Creado '+name);await load();
  }catch(e){say('Error: '+e.message)}
}
async function extract(it,newFolder){if(blockRO())return;
  try{
    say('Extrayendo...');const z=await JSZip.loadAsync(await it.handle.getFile());
    let root=cur;if(newFolder)root=await cur.getDirectoryHandle(await uniqueName(cur,it.name.replace(/\.[^.]+$/,'')),{create:true});
    for(const p in z.files){
      const e=z.files[p];const parts=p.split('/').filter(Boolean);
      if(parts.some(s=>s=='..'))continue;
      let d=root;const last=e.dir?parts.length:parts.length-1;
      for(let i=0;i<last;i++)d=await d.getDirectoryHandle(parts[i],{create:true});
      if(!e.dir){const w=await(await d.getFileHandle(parts[parts.length-1],{create:true})).createWritable();await w.write(await e.async('blob'));await w.close()}
    }
    say('Extraído');await load();
  }catch(e){say('Error: '+e.message)}
}
/* ---- teclado / mando ---- */
document.addEventListener('keydown',e=>{
  if($('menu').classList.contains('on')){
    const bs=[...$('mb').querySelectorAll('button')],i=bs.indexOf(document.activeElement);
    if(e.key=='ArrowDown'){bs[(i+1)%bs.length].focus();e.preventDefault()}
    else if(e.key=='ArrowUp'){bs[(i-1+bs.length)%bs.length].focus();e.preventDefault()}
    else if(e.key=='Escape'||e.key=='Backspace'){closeMenu()}
    return;
  }
  if($('ov').classList.contains('on')){
    if(e.key=='Escape'){closeOv();return}
    if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();saveText();return}
    if(!editing){if(e.key=='PageDown'||e.key=='ArrowRight'&&ov.k=='img'){step(1)}else if(e.key=='PageUp'||e.key=='ArrowLeft'&&ov.k=='img'){step(-1)}else if(e.key=='Backspace')closeOv()}
    return;
  }
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(document.activeElement.tagName=='BUTTON'&&(e.key=='Enter'||e.key==' '))return;
  if(e.key=='ArrowDown'){sel=Math.min(items.length-1,sel+1);render();e.preventDefault()}
  else if(e.key=='ArrowUp'){if(sel==0)document.querySelector('#bar button').focus();else{sel--;render()}e.preventDefault()}
  else if(e.key=='Enter'){openItem()}
  else if(e.key=='Backspace'){up()}
  else if(e.key==' '){const it=items[sel];if(it){marked.has(it.name)?marked.delete(it.name):marked.add(it.name);render();e.preventDefault()}}
  else if(e.key=='ContextMenu'||e.key=='F2'){itemMenu()}
  else if(e.key=='Delete'){del()}
  else if(e.ctrlKey&&e.key=='c'){clip=targets();say(clip.length+' copiado(s)')}
  else if(e.ctrlKey&&e.key=='v'){paste()}
});
document.querySelector('#bar').addEventListener('keydown',e=>{
  const bs=[...document.querySelectorAll('#bar button')],i=bs.indexOf(document.activeElement);
  if(e.key=='ArrowRight'){bs[Math.min(bs.length-1,i+1)].focus()}
  else if(e.key=='ArrowLeft'){bs[Math.max(0,i-1)].focus()}
  else if(e.key=='ArrowDown'){document.activeElement.blur();render();e.stopPropagation()}
});
if(!window.showDirectoryPicker)$('warn').style.display='block';
</script>
</body>
</html>
